<style>
/* ================= CSS ================= */
:root {
    --bg-dark: #050608;
    --bg-dark-2: #0a0d12;
    --bg-card: #10141b;
    --bg-card-2: #0c0f14;
    --primary: #22d3ee;
    --primary-hover: #67e8f9;
    --strand-b: #818cf8;
    --strand-b-soft: #6366f1;
    --text-light: #f4f4f5;
    --text-muted: #9ca3af;
    --border-soft: rgba(255,255,255,0.07);
    --font-display: 'Space Grotesk', 'Segoe UI', Tahoma, sans-serif;
    --font-body: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

html { scroll-behavior: smooth; }

* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: var(--font-body);
}

body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    overflow-x: hidden;
    position: relative;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

/* ============ Ambient molecular background ============ */
#molecule-field {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
#molecule-field canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; }

.base-letter {
    position: absolute;
    font-family: var(--font-mono);
    color: var(--primary);
    opacity: 0;
    font-size: 14px;
    animation: drift-up linear infinite;
    text-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
}
.base-letter.violet { color: var(--strand-b); text-shadow: 0 0 8px rgba(129, 140, 248, 0.5); }

@keyframes drift-up {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.5; }
    92%  { opacity: 0.35; }
    100% { transform: translateY(-110vh) translateX(var(--drift-x, 20px)) rotate(180deg); opacity: 0; }
}

/* ============ Navbar ============ */
.navbar {
    display: flex; justify-content: space-between; align-items: center;
    background-color: rgba(5, 6, 8, 0.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 15px 5%; position: sticky; top: 0; z-index: 1000;
    border-bottom: 1px solid var(--border-soft);
}

.navbar .logo {
    color: var(--primary); font-size: 24px; font-weight: 700;
    font-family: var(--font-display);
    text-shadow: 0 0 14px rgba(34, 211, 238, 0.45);
    letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 10px;
}
.navbar .logo .helix-mini { width: 20px; height: 26px; }

.nav-links { list-style: none; display: flex; align-items: center; gap: 25px; }
.nav-links a { color: var(--text-light); text-decoration: none; font-weight: 500; transition: 0.3s; position: relative; }
.nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -4px; width: 0; height: 1px;
    background: var(--primary); transition: width 0.3s ease;
}
.nav-links a:hover { color: var(--primary); }
.nav-links a:hover::after { width: 100%; }

.lang-btn {
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--text-muted);
    color: var(--text-light); padding: 6px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s;
    font-family: var(--font-mono); font-size: 0.85rem;
}
.lang-btn:hover { border-color: var(--primary); color: var(--primary); }

.login-btn {
    background-color: var(--primary); color: var(--bg-dark); border: none;
    padding: 10px 24px; border-radius: 20px; cursor: pointer; font-weight: 700; transition: 0.3s;
}
.login-btn:hover { background-color: var(--primary-hover); box-shadow: 0 4px 20px rgba(34, 211, 238, 0.4); transform: translateY(-2px); }

/* ============ Hero ============ */

    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    text-align: center; position: relative; padding: 120px 20px 80px;
    overflow: hidden;
}
